<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portafolio de Álvaro Gael García Ramírez, estudiante de Ingeniería en Sistemas Computacionales con experiencia en soporte y gestión administrativa." />
    <meta name="theme-color" content="#2563EB" />
    <title>Álvaro Gael García Ramírez | Portafolio</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F172A'/%3E%3Cpath d='M16 47 29 15h7l13 32h-8l-3-8H26l-3 8Zm13-15h7l-3.5-10Z' fill='%2338BDF8'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
    <script>
      (() => {
        const isManual = localStorage.getItem('portfolio-theme-manual') === 'true';
        const saved = isManual ? localStorage.getItem('portfolio-theme') : 'light';
        const theme = (saved === 'dark') ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-brand-bgLight text-brand-textLight dark:bg-brand-bgDark dark:text-brand-textDark font-body min-w-[320px] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
